      v.nodeViews[node.id] = { pillar, label, el };
    }
    // Army figure: a violet Lich-like shape.
    const fig = new THREE.Group();
    const body = new THREE.Mesh(new THREE.OctahedronGeometry(2.4), new THREE.MeshStandardMaterial({ color: 0x5a2d82, emissive: 0x2a0f45, roughness: 0.5, flatShading: true }));
    body.scale.y = 1.6; body.position.y = 4.2;
    const crown = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.25, 6, 12), new THREE.MeshStandardMaterial({ color: 0xc9a227, emissive: 0x3a2a00 }));
    crown.rotation.x = Math.PI / 2; crown.position.y = 8.4;
    fig.add(body, crown);
    v.army = fig;
    v.armyBody = body;
    v.worldRoot.add(fig);
    this.placeArmy();
    this.refresh();
  },
  placeArmy() {
    // Stands one tile south-east of the node so the pillar does not hide it.
    const n = Campaign.armyNode(), [q, r] = neighbor(n.q, n.r, 2), p = hexToWorld(q, r);
    game.view.army.position.set(p.x, game.world.groundAt(p.x, p.z), p.z);
  },
  // Update pillar colors, heights and labels from the campaign state.
  refresh() {
    for (const node of DATA.nodes) {
      const nv = game.view.nodeViews[node.id];
      const revealed = Campaign.isRevealed(node);
      const owner = Campaign.owner(node);
      const village = node.type === 'VILLAGE';
      nv.pillar.scale.set(village ? 0.6 : 1, revealed ? (village ? 18 : 40) : 10, village ? 0.6 : 1);
      nv.el.classList.toggle('village', village);
      nv.pillar.material.color.set(revealed ? DATA.factions[owner].color : '#8a8a8a');
      nv.el.textContent = revealed ? node.name + (node.special ? ' ★' : '') : '?';
      nv.el.classList.toggle('unknown', !revealed);
      nv.el.classList.toggle('selected', UI.selectedNode === node.id);
    }
  },
  setVisible(on) { game.view.worldRoot.visible = on; for (const id in game.view.nodeViews) game.view.nodeViews[id].label.visible = on; if (on) this.updateLabels(); },
  // Village labels only near the camera pivot (or when selected); larger places always show.
  updateLabels() {
    const [pq, pr] = game.view.cam.pivotTile();
    // Labels hidden in the fog would float above the horizon in flat views: cut them off where the fog is ~95 %.
    const v = game.view, maxDist = 1.73 / v.scene.fog.density;
    for (const node of DATA.nodes) {
      const nv = v.nodeViews[node.id];
      const inFog = nv.pillar.position.distanceTo(v.camera.position) > maxDist;
      nv.pillar.visible = !inFog;
      if (node.type !== 'VILLAGE') { nv.label.visible = !inFog; continue; }
      nv.label.visible = !inFog && (UI.selectedNode === node.id || hexDistance(node.q, node.r, pq, pr) <= VILLAGE_LABEL_DISTANCE);
    }
  }
};

// Journey: the figure glides along the road, the camera follows. Every travel day may bring a
// random encounter (DATA.encounters); the battle happens on the road and the journey goes on afterwards.
async function startTravel(target, resume = null) {
  const c = game.campaign, from = Campaign.armyNode();
  if (target.id === from.id || (game.mode !== 'world' && !resume)) return;
  const days = Campaign.travelDays(from, target);
  game.mode = 'travel';
  UI.renderInfo();
  const a = hexToWorld(...neighbor(from.q, from.r, 2)), b = hexToWorld(...neighbor(target.q, target.r, 2));
  const fig = game.view.army, cam = game.view.cam;
  // Where the encounter happens (fraction of the road), decided up front.
  const plan = resume ? null : Campaign.rollEncounter(from, target, days);
  const k0 = resume ? resume.at : 0, k1 = plan ? plan.at : 1;
  cam.follow = fig;
  await tween(TRAVEL_SECONDS * Math.max(0.2, k1 - k0), k => {
    const t = k0 + (k1 - k0) * (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);   // ease in-out
    fig.position.x = a.x + (b.x - a.x) * t;
    fig.position.z = a.z + (b.z - a.z) * t;
    fig.position.y = game.world.groundAt(fig.position.x, fig.position.z);
  });
  cam.follow = null;
  if (plan) {
    // Ambush on the road: days so far pass, then the battle. Victory continues the journey.
    const daysSoFar = Math.max(1, Math.round(days * plan.at));
    Campaign.advanceDays(daysSoFar);
    c.travel = { targetId: target.id, at: plan.at, daysLeft: Math.max(0, days - daysSoFar) };
    c.prevNodeId = from.id;
    UI.toast(`Hinterhalt! ${plan.node.name}.`);
    UI.updateHeader();
    game.mode = 'world';
    await Battle.start(plan.node);
    return;
  }
  c.prevNodeId = from.id;
  c.nodeId = target.id;
  c.travel = null;
  Campaign.advanceDays(resume ? resume.daysLeft : days);
  Campaign.healAtPhylactery();
  game.mode = 'world';
  WorldView.placeArmy();
  WorldView.refresh();
  UI.selectNode(target.id);
  UI.updateHeader();
  SaveGame.save();
  if (target.id === PHYLACTERY.id) UI.toast('Im Hügelgrab: Die Untoten sind geheilt.');
}
// Continues an interrupted journey after a won encounter.
function resumeTravel() {
  const c = game.campaign, t = c.travel && NODE_BY_ID[c.travel.targetId];
  if (!t) { c.travel = null; return; }
  const a = hexToWorld(...neighbor(Campaign.armyNode().q, Campaign.armyNode().r, 2)), b = hexToWorld(...neighbor(t.q, t.r, 2));
  game.view.army.position.set(a.x + (b.x - a.x) * c.travel.at, 0, a.z + (b.z - a.z) * c.travel.at);
  startTravel(t, c.travel);
}

// Minimap: full map drawn once from the precomputed floor colors (pixels are only
// written, never read), plus an overlay with places, army and view window.
const Minimap = {
  ZOOMS: [1, 2, 4, 8, 16],
  zoomIdx: 2,                  // start at 4x around the camera
  W: 340, H: 200,              // CSS size; the canvas uses twice the resolution
  init() {
    // Plain sRGB components 0..1 from the hex strings (THREE.Color would convert to linear).
    const hex = h => ({ r: parseInt(h.slice(1, 3), 16) / 255, g: parseInt(h.slice(3, 5), 16) / 255, b: parseInt(h.slice(5, 7), 16) / 255 });
    const cols = FLOOR_KEYS.map(k => hex(DATA.floorTypes[k].color));
    const floor = game.world.floor;
    // Full-resolution map (1 pixel = 1 tile) for close zoom levels; pixels are only written.
    const full = this.full = document.createElement('canvas');
    full.width = WIDTH; full.height = HEIGHT;
    const fctx = full.getContext('2d'), img = fctx.createImageData(WIDTH, HEIGHT);
    for (let i = 0; i < floor.length; i++) {
      const c = cols[floor[i]], o = i * 4;
      img.data[o] = c.r * 255; img.data[o+1] = c.g * 255; img.data[o+2] = c.b * 255; img.data[o+3] = 255;
    }
    fctx.putImageData(img, 0, 0);
    // Averaged 4x4 version for the overview (avoids noisy downscaling).
    const K = 4, MW = Math.ceil(WIDTH / K), MH = Math.ceil(HEIGHT / K);
    const small = this.small = document.createElement('canvas');
    small.width = MW; small.height = MH;
    const sctx = small.getContext('2d'), simg = sctx.createImageData(MW, MH);
    for (let my = 0; my < MH; my++) for (let mx = 0; mx < MW; mx++) {
      let r = 0, g = 0, b = 0, n = 0;
      for (let y = my * K; y < Math.min(HEIGHT, my * K + K); y++) for (let x = mx * K; x < Math.min(WIDTH, mx * K + K); x++) {
        const c = cols[floor[y * WIDTH + x]]; r += c.r; g += c.g; b += c.b; n++;
      }
      const o = (my * MW + mx) * 4;
      simg.data[o] = r / n * 255; simg.data[o+1] = g / n * 255; simg.data[o+2] = b / n * 255; simg.data[o+3] = 255;
    }
    sctx.putImageData(simg, 0, 0);
    const cv = this.canvas = document.getElementById('miniMap');
    cv.width = this.W * 2; cv.height = this.H * 2;
    this.ctx = cv.getContext('2d');
    cv.addEventListener('pointerdown', ev => {
      if (game.mode !== 'world') return;
      const rect = cv.getBoundingClientRect();
      const [q, r] = this.toTile((ev.clientX - rect.left) / rect.width * cv.width, (ev.clientY - rect.top) / rect.height * cv.height);
      game.view.cam.lookAtTile(Math.min(WIDTH - 1, Math.max(0, Math.round(q))), Math.min(HEIGHT - 1, Math.max(0, Math.round(r))));
      this.draw();
    });
    cv.addEventListener('wheel', ev => { ev.preventDefault(); this.zoom(ev.deltaY < 0 ? 1 : -1); }, { passive: false });
    document.getElementById('miniIn').onclick = () => this.zoom(1);
    document.getElementById('miniOut').onclick = () => this.zoom(-1);
  },
  zoom(step) {
    this.zoomIdx = Math.min(this.ZOOMS.length - 1, Math.max(0, this.zoomIdx + step));
    document.getElementById('miniZoom').textContent = this.ZOOMS[this.zoomIdx] + '×';
    this.draw();
  },
  // Visible window in tile coordinates, centered on the camera pivot and kept inside the map.
  view() {
    const z = this.ZOOMS[this.zoomIdx], cw = this.canvas.width, ch = this.canvas.height;
    // Tiles per canvas pixel: at 1x the whole map fits (letterboxed to the canvas aspect).
    const scale = Math.max(WIDTH / cw, HEIGHT / ch) / z;
    const vw = cw * scale, vh = ch * scale;
    const [pq, pr] = game.view.cam.pivotTile();
    const x0 = vw >= WIDTH ? (WIDTH - vw) / 2 : Math.min(WIDTH - vw, Math.max(0, pq - vw / 2));
    const y0 = vh >= HEIGHT ? (HEIGHT - vh) / 2 : Math.min(HEIGHT - vh, Math.max(0, pr - vh / 2));
    return { x0, y0, scale, z };
  },
  toTile(px, py) { const v = this.view(); return [v.x0 + px * v.scale, v.y0 + py * v.scale]; },
  // Place symbols: circle = small (villages, small towns), square = medium, star = large cities;
  // the phylactery is a diamond. Within a shape the size grows with the garrison.
  initSymbols() {
    const shapeOf = n => n.type === 'PHYLACTERY' ? 'diamond' : n.size >= 64 ? 'star' : n.size >= 32 ? 'square' : 'circle';
    const RANGE = { circle: [3.5, 7], square: [5.5, 8.5], star: [10, 14], diamond: [8, 8] };
    const strength = n => Object.values(n.garrison || {}).reduce((a, b) => a + b, 0) + (n.type === 'VILLAGE' ? 0 : 8);
    const groups = {};
    for (const n of DATA.nodes) (groups[shapeOf(n)] = groups[shapeOf(n)] || []).push(n);
    this.symbols = {};
    for (const [shape, list] of Object.entries(groups)) {
      const vals = list.map(strength), lo = Math.min(...vals), hi = Math.max(...vals), [a, b] = RANGE[shape];
      for (const n of list) this.symbols[n.id] = { shape, size: a + (b - a) * (hi > lo ? (strength(n) - lo) / (hi - lo) : 0.5) };
    }
  },
  symbolPath(ctx, shape, x, y, r) {
    ctx.beginPath();
    if (shape === 'circle') ctx.arc(x, y, r, 0, Math.PI * 2);
    else if (shape === 'square') ctx.rect(x - r, y - r, 2 * r, 2 * r);
    else if (shape === 'diamond') { ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }
    else for (let i = 0; i < 10; i++) {               // five-pointed star
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    if (shape === 'star') ctx.closePath();
  },
  draw() {
    if (!this.symbols) this.initSymbols();
    const ctx = this.ctx, cv = this.canvas, v = this.view();
    const sx = q => (q - v.x0) / v.scale, sy = r => (r - v.y0) / v.scale;
    ctx.fillStyle = '#22364f'; ctx.fillRect(0, 0, cv.width, cv.height);
    // Base map: averaged overview when far out, crisp tiles when close.
    const useFull = v.z >= 4, src = useFull ? this.full : this.small, k = useFull ? 1 : 4;
    ctx.imageSmoothingEnabled = !useFull;
    ctx.drawImage(src, 0, 0, src.width, src.height, sx(0), sy(0), src.width * k / v.scale, src.height * k / v.scale);
    // Places: dots, names when zoomed in.
    ctx.font = '22px "IM Fell English", Georgia, serif';
    ctx.textAlign = 'center';
    for (const node of DATA.nodes) {
      const x = sx(node.q), y = sy(node.r);
      if (x < -40 || y < -40 || x > cv.width + 40 || y > cv.height + 40) continue;
      const rev = Campaign.isRevealed(node), village = node.type === 'VILLAGE';
      const sym = this.symbols[node.id], rad = sym.size * (v.z >= 4 ? 1.4 : 1);
      ctx.fillStyle = rev ? DATA.factions[Campaign.owner(node)].color : '#888';
      ctx.strokeStyle = rev && node.special ? '#e0b830' : '#2b2116'; ctx.lineWidth = rev && node.special ? 3 : 2;
      this.symbolPath(ctx, sym.shape, x, y, rad); ctx.fill(); ctx.stroke();
      if (rev && (village ? v.z >= 8 : v.z >= 2)) {
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(233,223,196,.9)'; ctx.fillStyle = '#2b2116';
        ctx.strokeText(node.name, x, y - rad - 6); ctx.fillText(node.name, x, y - rad - 6);
      }
    }
    // Army and the visible tile window.
    const [aq, ar] = worldToHex(game.view.army.position.x, game.view.army.position.z);
    ctx.fillStyle = '#c9a227'; ctx.strokeStyle = '#2b2116'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx(aq), sy(ar), 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Camera: an open view cone from the camera position toward the pivot, opening by the
    // horizontal field of view, so the viewing direction is visible at any zoom.
    const cam = game.view.cam, camera = game.view.camera;
    const [pq, pr] = cam.pivotTile();
    const fx = -Math.sin(cam.yaw) / COL_SPACING, fz = -Math.cos(cam.yaw) / ROW_SPACING;   // forward in tile units
    const flen = Math.hypot(fx, fz), dx = fx / flen, dy = fz / flen;
    const half = Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect);
    const px = sx(pq), py = sy(pr), back = 22, len = 64;
    const ax = px - dx * back, ay = py - dy * back;                 // apex behind the pivot
    const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
    const [lx, ly] = rot(dx, dy, -half), [rx, ry] = rot(dx, dy, half);
    ctx.lineJoin = 'round';
    for (const [w, c] of [[6, 'rgba(43,33,22,.85)'], [3, '#f4ecd6']]) {
      ctx.strokeStyle = c; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(ax + lx * len, ay + ly * len); ctx.lineTo(ax, ay); ctx.lineTo(ax + rx * len, ay + ry * len); ctx.stroke();
    }
    ctx.fillStyle = '#f4ecd6'; ctx.strokeStyle = '#2b2116'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
};

// =============================================================================
// Battlefield
// Builds the size x size battle area from the real world tiles around a node
// and adds buildings, fences, special grounds and edge types. Deterministic:
// all randomness comes from hash2 with a seed derived from the node id.
// =============================================================================
const POWER_NAMES = { PIERCE: 'Stich', BLUNT: 'Wucht', SIEGE: 'Belagerung', FIRE: 'Feuer', POISON: 'Gift', ARCANE: 'Arkan',
  REND: 'Reißen', SOUL: 'Seele', HOLY: 'Heilig', CHAOS: 'Chaos', HEAL: 'Heilung' };
const DEFENSE_NAMES = { UNARMORED: 'Ungerüstet', LIGHT: 'Leicht', MEDIUM: 'Mittel', HEAVY: 'Schwer', FORTIFIED: 'Befestigt', DIVINE: 'Göttlich' };
const BLOCKS_MELEE = new Set(['WALL', 'WALL_DESTRUCTIBLE', 'WALL_TRANSPARENT']);
const BLOCKS_SIGHT = new Set(['WALL', 'WALL_DESTRUCTIBLE']);
// PROMPT 8.5: a priest without wounded allies attacks with 3 HOLY damage.
const PRIEST_ATTACK = { power: 'HOLY', damage: 3 };
const RULES = DATA.rules;
// Ticks a unit waits after its turn: linear in initiative (2520 / ini).
const turnTicks = def => Math.round(RULES.tickBase / def.initiative);
// Old bonus values were in units of 1/10 round; scale them to ticks.
const roundFrac = x => Math.round(x * RULES.roundTicks / 10);
// Stacks (Heroes of Might and Magic style): one battle figure per unit type and side.
// u.hp is the stack's total; only the top creature can be wounded.
const stackCount = u => u.hp > 0 ? Math.ceil(u.hp / u.def.hp - 1e-9) : 0;
const topHp = u => u.hp - (stackCount(u) - 1) * u.def.hp;
// Splits enemy groups into several stacks (rules in DATA.stacks): the type with the largest
// stacks gets another one while the limits allow it and every part keeps minStackSize units.
function splitStacks(groups) {
  const S = DATA.stacks, types = groups.length;
  const limit = types >= S.fullStacksFromTypes ? S.maxStacks : Math.min(S.maxStacks, types * S.stacksPerTypeFew);
  const parts = groups.map(() => 1);
  let total = types;
  while (total < limit) {
    let best = -1, bestSize = 0;
    groups.forEach((g, i) => {
      const size = g.hps.length / parts[i];
      if (parts[i] < S.maxPerType && g.hps.length / (parts[i] + 1) >= S.minStackSize && size > bestSize) { best = i; bestSize = size; }
    });
    if (best < 0) break;
    parts[best]++; total++;
  }
  const out = [];
  groups.forEach((g, i) => {
    const k = parts[i], n = g.hps.length;
    for (let j = 0, start = 0; j < k; j++) {
      const len = Math.floor(n / k) + (j < n % k ? 1 : 0);
      out.push({ type: g.type, hps: g.hps.slice(start, start + len) }); start += len;
    }
  });
  return out;
}
// Unit portrait (rendered from the Godot figures, data/portraits.js); colored placeholder otherwise.
const PORTRAITS = window.HARMBRINGER_PORTRAITS || {};
function portraitHtml(type, def) {
  return PORTRAITS[type] ? `<img class="portrait" src="${PORTRAITS[type]}" alt="${def.name}">`
    : `<span class="portrait none" style="background:${def.color}" title="${def.name}"></span>`;
}
// Height at which figures and overlays sit on a battle tile: water tiles lie below the water
// plane, so everything there is shown on the water surface (otherwise reach and flyers vanish).
const surfaceY = t => Math.max(t.y, HEX.waterLevel + 0.02);
// Figures (tools/build_units.py) are built at real proportions: a human is FIGURE_HUMAN units tall.
const FIGURE_HUMAN = 1.8;
const FIGURE_SCALE = {};                       // per-unit correction if ever needed
// Unit figures (slimmed Godot models). Each lives in data/figures/<type>.js as base64 GLB and is
// loaded on demand with a <script> tag, which also works under file:// (fetch would not).
const Figures = {
  templates: {},          // type -> normalized THREE.Group (1 unit tall, feet at y = 0) or null
  pending: {},
  load(type) {
    if (type in this.templates) return Promise.resolve(this.templates[type]);
    if (!PORTRAITS[type]) { this.templates[type] = null; return Promise.resolve(null); }   // no figure for this unit
    if (this.pending[type]) return this.pending[type];
    const done = tpl => { this.templates[type] = tpl; delete this.pending[type]; return tpl; };
    const p = new Promise(resolve => {
      const timer = setTimeout(() => resolve(null), 15000);
      const finish = tpl => { clearTimeout(timer); resolve(tpl); };
      const el = document.createElement('script');
      el.src = `data/figures/${type}.js?v=4`;
      el.onerror = () => finish(null);
      el.onload = () => {
        const b64 = (window.HARMBRINGER_FIGURES || {})[type];
        if (!b64) return finish(null);
        const bin = atob(b64), buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        new GLTFLoader().parse(buf.buffer, '', gltf => {
          const root = gltf.scene, box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3());

// Groups individual units [{type, hp}] by type in order of first appearance -> [{type, hps: [...]}].
function groupByType(list) {
