class Battlefield {
  constructor(node) {
    this.node = node;
    this.size = node.size;
    this.cq = node.q; this.cr = node.r;
    this.q0 = node.q - node.size / 2;
    this.r0 = node.r - node.size / 2;
    this.seed = stringSeed(node.id);
    this.rng = makeRng(this.seed);
    this.tiles = new Array(this.size * this.size);
    this.buildings = [];
    const w = game.world;
    for (let j = 0; j < this.size; j++) for (let i = 0; i < this.size; i++) {
      const q = this.q0 + i, r = this.r0 + j;
      const y = w.heightAt(q, r);
      this.tiles[j * this.size + i] = inMap(q, r)
        ? { q, r, floor: w.floorKeyAt(q, r), y, level: Math.round(y), edges: ['OPEN','OPEN','OPEN','OPEN','OPEN','OPEN'], unit: null, building: null }
        : null;   // field corner outside the map (does not happen with the given nodes)
    }
    this.build();
  }
  get(q, r) {
    const i = q - this.q0, j = r - this.r0;
    if (i < 0 || j < 0 || i >= this.size || j >= this.size) return null;
    return this.tiles[j * this.size + i];
  }
  contains(q, r) { return !!this.get(q, r); }
  index(t) { return (t.r - this.r0) * this.size + (t.q - this.q0); }
  neighborTile(t, d) { const [nq, nr] = neighbor(t.q, t.r, d); return this.get(nq, nr); }
  isWater(t) { return !!DATA.floorTypes[t.floor].water; }
  walkable(t) { return DATA.floorTypes[t.floor].moveCost !== null; }
  tilesWithin(q, r, rad) {
    const out = [];
    for (const t of this.tiles) if (t && hexDistance(q, r, t.q, t.r) <= rad) out.push(t);
    return out;
  }
  // Sets an edge on both sides (the tile and its neighbor across edge d).
  setEdge(t, d, type) {
    t.edges[d] = type;
    const n = this.neighborTile(t, d);
    if (n) n.edges[opposite(d)] = type;
  }
  randomTileWithin(rad) {
    for (let k = 0; k < 50; k++) {
      const q = this.cq + Math.round((this.rng() * 2 - 1) * rad), r = this.cr + Math.round((this.rng() * 2 - 1) * rad);
      const t = this.get(q, r);
      if (t && hexDistance(q, r, this.cq, this.cr) <= rad) return t;
    }
    return this.get(this.cq, this.cr);
  }

  build() {
    const type = this.node.type, size = this.size;
    const set = DATA.buildingSets[type];
    if (type === 'WORLDLY') {
      for (const t of this.tilesWithin(this.cq, this.cr, 3)) if (!this.isWater(t)) t.floor = 'COBBLESTONE';
      if (size >= set.cityWallMinSize) this.placeCityWall(set.cityWallRadius, set.gates);
    }
    if (set) {
      const count = set.count ?? set.countPer16 * size / 16;
      const fences = set.fences ?? set.fencesPer16 * size / 16;
      this.placeBuildings(set, count, Math.floor(size / 3));
      if (type === 'CHRISTIAN') this.consecrate(set);
      this.placeFences(fences);
    }
    if (type === 'MYTHIC') {
      if (this.node.id === 'teufelsmoor')
        for (const t of this.tilesWithin(this.cq, this.cr, 4)) if (!this.isWater(t)) t.floor = 'BOG';
      for (const t of this.tilesWithin(this.cq, this.cr, 2)) if (!this.isWater(t)) t.floor = 'PAGAN_GROUND';
      // Hünensteine: 6-10 single cover edges near the center.
      const stones = 6 + Math.floor(this.rng() * 5);
      let placed = 0;
      for (let k = 0; k < 80 && placed < stones; k++) {
        const t = this.randomTileWithin(4), d = Math.floor(this.rng() * 6), n = this.neighborTile(t, d);
        if (!n || t.edges[d] !== 'OPEN' || this.isWater(t)) continue;
        this.setEdge(t, d, 'COVER');
        placed++;
      }
    }
  }

  // Weighted pick from a [key, weight] list.
  pickWeighted(mix) {
    const sum = mix.reduce((s, e) => s + e[1], 0);
    let x = this.rng() * sum;
    for (const [k, w] of mix) { x -= w; if (x < 0) return k; }
    return mix[mix.length - 1][0];
  }

  // Tiles of a building template at an anchor, rotated by rot * 60 degrees (null if off the field).
  shapeTiles(tpl, anchor, rot) {
    const out = [];
    for (const path of tpl.tiles) {
      let q = anchor.q, r = anchor.r;
      for (const d of path) [q, r] = neighbor(q, r, (d + rot) % 6);
      const t = this.get(q, r);
      if (!t || out.includes(t)) return null;
      out.push(t);
    }
    return out;
  }

  // Tries to place one building of the given template. Returns true on success.
  tryBuilding(key, radius) {
    const tpl = DATA.buildings[key];
    const anchor = this.randomTileWithin(radius), rot = Math.floor(this.rng() * 6);
    const parts = this.shapeTiles(tpl, anchor, rot);
    if (!parts) return false;
    if (parts.some(t => t.building !== null || this.isWater(t))) return false;
    const levels = parts.map(t => t.level);
    if (Math.max(...levels) - Math.min(...levels) >= 2) return false;
    // Must not touch another building, and no wall (e.g. the city wall) may run through it.
    for (const t of parts) for (let e = 0; e < 6; e++) {
      const n = this.neighborTile(t, e);
      if (n && n.building !== null) return false;
      if (n && parts.includes(n) && t.edges[e] !== 'OPEN') return false;
    }
    // Outward edges and door candidates (a walkable tile outside the building).
    const outward = [];
    for (const t of parts) for (let e = 0; e < 6; e++) {
      const n = this.neighborTile(t, e);
      if (n && parts.includes(n)) continue;
      outward.push({ t, e, n });
    }
    const candidates = outward.filter(o => o.n && o.t.edges[o.e] === 'OPEN' && this.walkable(o.n) && !this.isWater(o.n) && Math.abs(o.n.level - o.t.level) < 2);
    if (candidates.length < tpl.doors) return false;
    // Doors: spread over different tiles where possible.
    const doors = [];
    for (let i = 0; i < tpl.doors; i++) {
      const pool = candidates.filter(c => !doors.includes(c) && !doors.some(d => d.t === c.t));
      const from = pool.length ? pool : candidates.filter(c => !doors.includes(c));
      doors.push(from[Math.floor(this.rng() * from.length)]);
    }
    const id = this.buildings.length;
    for (const t of parts) { t.building = id; t.floor = tpl.floor; }
    const wall = tpl.wall || 'WALL';
    for (const o of outward) if (!doors.includes(o)) this.setEdge(o.t, o.e, wall);
    for (const d of doors) this.setEdge(d.t, d.e, 'OPEN');
    // Windows: some outer walls become transparent.
    const walls = outward.filter(o => !doors.includes(o) && o.n && o.t.edges[o.e] === 'WALL');
    for (let i = 0; i < (tpl.windows || 0) && walls.length; i++) {
      const w = walls.splice(Math.floor(this.rng() * walls.length), 1)[0];
      this.setEdge(w.t, w.e, 'WALL_TRANSPARENT');
    }
    this.buildings.push({ id, key, name: tpl.name, tiles: parts, doors });
    return true;
  }

  placeBuildings(set, count, innerRadius) {
    // The "first" building (the church) is tried close to the center first.
    if (set.first) {
      let ok = false;
      for (let a = 0; a < 120 && !ok; a++) ok = this.tryBuilding(set.first, a < 60 ? 3 : innerRadius);
    }
    let fails = 0;
    while (this.buildings.length < count && fails < 30) {
      const key = this.pickWeighted(set.mix);
      let ok = false;
      for (let a = 0; a < 25 && !ok; a++) ok = this.tryBuilding(key, innerRadius);
      if (!ok) fails++;
    }
  }

  // Christian places: holy ground around the church, graveyard next to it.
  consecrate(set) {
    const church = this.buildings.find(b => b.key === set.first);
    if (!church) return;
    const c0 = church.tiles[0], holy = new Set();
    for (const t of this.tilesWithin(c0.q, c0.r, set.holyRadius)) {
      if (this.isWater(t) || (t.building !== null && t.building !== church.id)) continue;
      t.floor = 'HOLY_GROUND'; holy.add(t);
    }
    let best = null, bestScore = -1;
    for (const c of this.tilesWithin(c0.q, c0.r, set.holyRadius + set.graveyardRadius + 2)) {
      if (hexDistance(c.q, c.r, c0.q, c0.r) < set.holyRadius + set.graveyardRadius) continue;
      const area = this.tilesWithin(c.q, c.r, set.graveyardRadius);
      const score = area.filter(t => !this.isWater(t) && t.building === null && !holy.has(t)).length + this.rng() * 0.5;
      if (score > bestScore) { bestScore = score; best = c; }
    }
    if (best) for (const t of this.tilesWithin(best.q, best.r, set.graveyardRadius))
      if (!this.isWater(t) && t.building === null && !holy.has(t)) t.floor = 'GRAVEYARD_GROUND';
  }

  // City wall: a ring of walls at the given hex radius with evenly spaced open gates.
  placeCityWall(radius, gates) {
    const cpos = hexToWorld(this.cq, this.cr), offset = this.rng() * Math.PI * 2;
    const halfGate = 1.6 / radius;                 // about one tile to each side of the gate center
    for (const t of this.tiles) {
      if (!t || hexDistance(t.q, t.r, this.cq, this.cr) !== radius) continue;
      const p = hexToWorld(t.q, t.r);
      const ang = Math.atan2(p.x - cpos.x, p.z - cpos.z);
      let inGate = false;
      for (let g = 0; g < gates; g++) {
        const ga = offset + g * Math.PI * 2 / gates;
        const diff = Math.abs(Math.atan2(Math.sin(ang - ga), Math.cos(ang - ga)));
        if (diff < halfGate) inGate = true;
      }
      if (inGate || this.isWater(t)) continue;
      for (let d = 0; d < 6; d++) {
        const n = this.neighborTile(t, d);
        if (n && !this.isWater(n) && hexDistance(n.q, n.r, this.cq, this.cr) === radius + 1) this.setEdge(t, d, 'WALL');
      }
    }
    this.cityWall = radius;
  }

  // Fences: lines of 4-6 tiles in direction d; edge (d+1)%6 becomes cover on both sides.
  placeFences(count) {
    for (let f = 0; f < count; f++) {
      let t = this.randomTileWithin(this.size / 2 - 2);
      const d = Math.floor(this.rng() * 6), len = 4 + Math.floor(this.rng() * 3), e = (d + 1) % 6;
      for (let i = 0; i < len && t; i++) {
        if (t.building !== null) break;
        const n = this.neighborTile(t, e);
        if (n && n.building === null && t.edges[e] === 'OPEN' && !this.isWater(t)) this.setEdge(t, e, 'COVER');
        t = this.neighborTile(t, d);
      }
    }
  }
}

// =============================================================================
// Pathfinding
// Dijkstra over the battlefield with the movement rules of PROMPT 8.4.
// =============================================================================
class MinHeap {
  constructor() { this.a = []; }
  push(cost, item) {
    const a = this.a; a.push([cost, item]);
    let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; }
  }
  pop() {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last; let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l;
        if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m;
      }
    }
    return top;
  }
  get size() { return this.a.length; }
}

const Pathfinding = {
  // Cost to step from A to B in direction d, or null if not allowed.
  stepCost(field, unit, A, d, B, ignoreUnits = false) {
    if (!B) return null;
    const def = unit.def;
    if (!def.spectral && (A.edges[d] !== 'OPEN' || B.edges[opposite(d)] !== 'OPEN')) return null;
    if (!def.flying && Math.abs(A.level - B.level) >= 2) return null;
    if (B.unit && B.unit !== unit && !def.flying && !ignoreUnits) return null;     // flyers may pass over units
    if (def.flying) return 1;
    return DATA.floorTypes[B.floor].moveCost;                        // null = impassable
  },
  // Returns { cost: Map(index -> cost), prev: Map(index -> index) } up to maxCost.
  // ignoreUnits: plan through occupied tiles (used by the AI to queue behind allies).
  search(field, unit, maxCost, ignoreUnits = false) {
    const start = field.get(unit.q, unit.r);
    const cost = new Map(), prev = new Map(), heap = new MinHeap();
    const si = field.index(start);
    cost.set(si, 0); heap.push(0, start);
    while (heap.size) {
      const [c, t] = heap.pop();
      if (c > cost.get(field.index(t))) continue;
      for (let d = 0; d < 6; d++) {
        const n = field.neighborTile(t, d);
        const sc = this.stepCost(field, unit, t, d, n, ignoreUnits);
        if (sc === null || sc === undefined) continue;
        const nc = c + sc;
        if (nc > maxCost) continue;
        const ni = field.index(n);
        if (!cost.has(ni) || nc < cost.get(ni)) { cost.set(ni, nc); prev.set(ni, field.index(t)); heap.push(nc, n); }
      }
    }
    return { cost, prev, start: si };
  },
  // Tiles the unit may end its move on (free tiles within its move points), incl. its own.
  reachable(field, unit, budget = unit.def.move) {
    const s = this.search(field, unit, budget);
    const tiles = [];
    for (const [i] of s.cost) { const t = field.tiles[i]; if (!t.unit || t.unit === unit) tiles.push(t); }
    return { ...s, tiles };
  },
  path(field, search, target) {
    const out = [];
    let i = field.index(target);
    if (!search.cost.has(i)) return null;
    while (i !== undefined) { out.push(field.tiles[i]); if (i === search.start) break; i = search.prev.get(i); }
    return out.reverse();
  }
};

// =============================================================================
// Combat rules (pure functions on data objects)
// =============================================================================
const Combat = {
  // Damage formula, PROMPT 8.4 (exact order of operations).
  damage(att, tgt, attLevel, tgtLevel, targetInCover) {
    const pd = DATA.powerDefense;
    let dmg = att.damage * pd[att.power][tgt.defense] / 100;
    if (attLevel > tgtLevel) dmg *= 1.25;      // high ground
    if (attLevel < tgtLevel) dmg *= 0.85;
    if (targetInCover) dmg *= 0.5;
    // Magic resist reduces magic power types by a percentage (rules block in world_data.js).
    // soulShield is no longer subtracted here: it is a pool consumed in Battle.applyDamage.
    if (RULES.magicPowers.includes(att.power)) dmg *= 1 - Math.min(RULES.mrCap, tgt.magicResist * RULES.mrPerPoint);
    dmg = Math.round(dmg);
    dmg = (pd[att.power][tgt.defense] === 0) ? 0 : Math.max(1, dmg);
    return dmg;
  },
  // Attack profile: what a unit does against a given target.
  profile(unit, target) {
    const def = unit.def;
    // A stack hits with the damage of all its creatures.
    const n = Math.max(1, stackCount(unit));
    if (def.power === 'HEAL') return target.side === unit.side ? { power: 'HEAL', damage: def.damage * n } : { power: PRIEST_ATTACK.power, damage: PRIEST_ATTACK.damage * n };
    return { power: def.power, damage: def.damage * n };
  },
  edgeBetween(field, a, b) {
    const d = directionTo(a.q, a.r, b.q, b.r);
    if (d < 0) return null;
    return [a.edges[d], b.edges[opposite(d)]];
  },
  // Line of sight from tile A to tile B (walls block, high ground in between blocks).
  lineOfSight(field, A, B) {
    const line = hexLine(A.q, A.r, B.q, B.r);
    const maxLevel = Math.max(A.level, B.level) + 1;
    let cover = false;
    for (let i = 1; i < line.length; i++) {
      const p = field.get(line[i - 1][0], line[i - 1][1]), c = field.get(line[i][0], line[i][1]);
      if (!p || !c) continue;
      const e = this.edgeBetween(field, p, c);
      if (e && (BLOCKS_SIGHT.has(e[0]) || BLOCKS_SIGHT.has(e[1]))) return { clear: false };
      if (i < line.length - 1 && c.level > maxLevel) return { clear: false };
      if (i === line.length - 1 && e && (e[0] === 'COVER' || e[1] === 'COVER')) cover = true;
    }
    return { clear: true, cover };
  },
  // Can `unit`, standing on tile `from`, attack (or heal) `target`? Returns { ok, cover, dist }.
  canAttack(field, unit, from, target) {
    const tt = field.get(target.q, target.r);
    if (!target.alive || target === unit) return { ok: false };
    const healing = unit.def.power === 'HEAL' && target.side === unit.side;
    if (target.side === unit.side && !healing) return { ok: false };
    if (healing && topHp(target) >= target.def.hp) return { ok: false };     // healing only mends the top creature
    const dist = hexDistance(from.q, from.r, tt.q, tt.r);
    let range = unit.def.range;
    if (range > 1 && from.level - tt.level >= 2) range += 1;        // ranged high ground bonus
    if (dist > range || dist < 1) return { ok: false };
    if (dist === 1) {
      const e = this.edgeBetween(field, from, tt);
      if (e && (BLOCKS_MELEE.has(e[0]) || BLOCKS_MELEE.has(e[1]))) return { ok: false };
      return { ok: true, cover: !!e && (e[0] === 'COVER' || e[1] === 'COVER'), dist, range };
    }
    const los = this.lineOfSight(field, from, tt);
    if (!los.clear) return { ok: false };
    return { ok: true, cover: los.cover, dist, range };
  },
  expected(field, unit, from, target, cover) {
    const prof = this.profile(unit, target);
    if (prof.power === 'HEAL') return Math.min(prof.damage, target.def.hp - topHp(target));
    return this.damage(prof, target.def, from.level, field.get(target.q, target.r).level, cover);
  }
};

// =============================================================================
// Battle view helpers (three.js objects for units, overlays and edges)
// =============================================================================
const BattleView = {
  shapeGeometry(shape) {
    let g;
    switch (shape) {
      case 'cone': g = new THREE.ConeGeometry(0.9, 2.4, 8); break;
      case 'capsule': g = new THREE.CapsuleGeometry(0.7, 1.2, 4, 8); break;
      case 'box': g = new THREE.BoxGeometry(1.5, 1.9, 1.5); break;
      case 'sphere': g = new THREE.SphereGeometry(0.9, 14, 10); break;
      case 'cylinder': g = new THREE.CylinderGeometry(0.7, 0.7, 2.2, 10); break;
      default: g = new THREE.OctahedronGeometry(1.1); g.scale(1, 1.6, 1);
    }
    g.computeBoundingBox();
    g.translate(0, -g.boundingBox.min.y, 0);      // stand on y = 0
    return g;
  },
  init(field) {
    const root = game.view.battleRoot;
    // Overlays: flat hexagons (reach / targets / path / sight cones).
    const geo = new THREE.CylinderGeometry(R * 0.86, R * 0.86, 0.1, 6);
    geo.rotateY(Math.PI / 6);
    const cap = field.size * field.size;
    const mk = (opacity) => {
      const m = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity, depthWrite: false }), cap);
      m.setColorAt(0, new THREE.Color(1, 1, 1)); m.count = 0; m.frustumCulled = false; m.renderOrder = 2;
      root.add(m); return m;
    };
    this.overlay = mk(0.5);
    this.pathOverlay = mk(0.75);
    this.coneOverlay = mk(0.22);
    // Active unit ring.
    this.ring = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.16, 6, 24), new THREE.MeshBasicMaterial({ color: 0xd8b030 }));
    this.ring.rotation.x = Math.PI / 2; this.ring.visible = false;
    root.add(this.ring);
    this.buildEdges(field);
  },
  setOverlay(mesh, list) {
    const m = mesh.instanceMatrix.array, c = mesh.instanceColor.array, col = new THREE.Color();
    list.forEach((it, i) => {
      const p = hexToWorld(it.t.q, it.t.r), o = i * 16;
      m.fill(0, o, o + 16); m[o] = 1; m[o + 5] = 1; m[o + 10] = 1; m[o + 15] = 1;
      m[o + 12] = p.x; m[o + 13] = surfaceY(it.t) + 0.08 + (it.lift || 0); m[o + 14] = p.z;
      col.set(it.color); c[i * 3] = col.r; c[i * 3 + 1] = col.g; c[i * 3 + 2] = col.b;
    });
    mesh.count = list.length;
    mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
  },
  buildEdges(field) {
    const root = game.view.battleRoot;
    this.edgeMeshes = [];
    this.optionalEdges = new THREE.Group();
    root.add(this.optionalEdges);
    const wallGeo = new THREE.BoxGeometry(R, 1.5, 0.3); wallGeo.translate(0, 0.75, 0);
    const tri = new THREE.Shape([new THREE.Vector2(-0.35, 0), new THREE.Vector2(0.35, 0), new THREE.Vector2(0, 0.8)]);
    const coverGeo = new THREE.ExtrudeGeometry(tri, { depth: R * 0.9, bevelEnabled: false });
    coverGeo.translate(0, 0, -R * 0.45); coverGeo.rotateY(Math.PI / 2);
    const mats = {
      WALL: new THREE.MeshStandardMaterial({ color: 0x9a2a22, roughness: 0.8 }),
      COVER: new THREE.MeshStandardMaterial({ color: 0xd8b830, roughness: 0.8 }),
      WALL_DESTRUCTIBLE: new THREE.MeshStandardMaterial({ color: 0xd8742a, roughness: 0.8 }),
      WALL_TRANSPARENT: new THREE.MeshStandardMaterial({ color: 0x4a7ad0, transparent: true, opacity: 0.45 })
    };
    for (const t of field.tiles) {
      if (!t) continue;
      for (let d = 0; d < 6; d++) {
        const type = t.edges[d];
        if (type === 'OPEN') continue;
        const n = field.neighborTile(t, d);
        if (n && n.edges[opposite(d)] === type && field.index(n) < field.index(t)) continue;   // draw shared edges once
        const mesh = new THREE.Mesh(type === 'COVER' ? coverGeo : wallGeo, mats[type]);
        const ed = edgeDirection(d), p = hexToWorld(t.q, t.r);
        mesh.position.set(p.x + ed.x * INRADIUS, Math.max(t.y, n ? n.y : t.y), p.z + ed.z * INRADIUS);
        mesh.rotation.y = -d * Math.PI / 3;
        mesh.userData.edge = { type, q: t.q, r: t.r, d };
        // Walls (buildings, city wall) are always shown; fences and stones only with the edge display.
        const alwaysShown = type !== 'COVER' || t.building !== null || (n && n.building !== null);
        (alwaysShown ? game.view.battleRoot : this.optionalEdges).add(mesh);
        this.edgeMeshes.push(mesh);
      }
    }
    this.optionalEdges.visible = game.showEdges;
  },
  createUnit(u) {
    const def = u.def, s = 1.0 + 0.35 * def.size;
    const group = new THREE.Group();
    const tpl = Figures.templates[u.type];
    let body;
    if (tpl) {
      // Figure: a human is 2.8 units tall; the model already carries its size, so `size` only adds a little.
      body = tpl.clone(true);
      body.scale.setScalar(2.8 * (1 + 0.1 * (def.size - 1)) * (FIGURE_SCALE[u.type] || 1));
      if (def.spectral) body.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.7; } });
    } else {
      body = new THREE.Mesh(this.shapeGeometry(def.shape),
        new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.6, flatShading: true, transparent: def.spectral, opacity: def.spectral ? 0.75 : 1 }));
      body.scale.setScalar(s);
    }
    body.position.y = 0.35 + (def.flying ? 1.2 : 0);
    body.traverse(o => { if (o.isMesh) o.userData.unitId = u.id; });
    const pedColor = u.side === 'player' ? DATA.factions.UNDEAD.color : DATA.factions[u.faction].color;
    const ped = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.9, 0.35, 6), new THREE.MeshStandardMaterial({ color: pedColor, roughness: 0.7 }));
    ped.rotation.y = Math.PI / 6; ped.position.y = 0.17;
    body.userData.unitId = ped.userData.unitId = u.id;
    group.add(ped, body);
    const el = document.createElement('div');
    el.className = 'unitLabel';
    el.innerHTML = `<span class="stackCount"></span><div class="hpbar ${u.side === 'player' ? 'player' : ''}"><div></div></div>`;
    const label = new CSS2DObject(el);
    label.position.y = body.position.y + (tpl ? tpl.userData.height * body.scale.y + 0.5 : 3.2 * s);
    group.add(label);
    game.view.battleRoot.add(group);
    u.view = { group, body, el, label };
    this.placeUnit(u);
    // Initial facing: enemies look where their sight cone points, the undead towards the field center.
    if (u.side === 'enemy') { const d = edgeDirection(u.facing); this.face(u, group.position.x + d.x, group.position.z + d.z); }
    else { const c = hexToWorld(game.battle.field.cq, game.battle.field.cr); this.face(u, c.x, c.z); }
    this.updateHp(u);
  },
  placeUnit(u) {
    const t = game.battle.field.get(u.q, u.r), p = hexToWorld(u.q, u.r);
    u.view.group.position.set(p.x, surfaceY(t), p.z);
  },
  updateHp(u) {
    // Bar = health of the top creature; the badge shows how many creatures are left.
    const n = stackCount(u);
    u.view.el.querySelector('.hpbar > div').style.width = (n ? 100 * topHp(u) / u.def.hp : 0) + '%';
    u.view.el.querySelector('.stackCount').textContent = n > 1 ? '×' + n : '';
  },
  floatText(u, text, heal) {
    const el = document.createElement('div');
    el.className = 'dmgText' + (heal ? ' heal' : '');
    el.textContent = text;
    const obj = new CSS2DObject(el);
    const base = u.view.group.position.clone();
    obj.position.copy(base).add(new THREE.Vector3(0, 4, 0));
    game.view.battleRoot.add(obj);
    tween(1.0, k => { obj.position.y = base.y + 4 + k * 3; el.style.opacity = String(1 - k * k); })
      .then(() => removeWithLabels(obj));
  },
  // Turns the figure towards a world position (figures look along +Z).
  face(u, x, z) {
    const p = u.view.group.position, dx = x - p.x, dz = z - p.z;
    if (dx * dx + dz * dz > 1e-6) u.view.body.rotation.y = Math.atan2(dx, dz);
  },
  // Melee lunge or projectile.
  async attackAnim(att, tgt, ranged) {
    const a = att.view.group.position.clone(), b = tgt.view.group.position.clone();
    this.face(att, b.x, b.z); this.face(tgt, a.x, a.z);
    if (!ranged) {
      await tween(0.25, k => { const f = Math.sin(k * Math.PI) * 0.45; att.view.group.position.lerpVectors(a, b, f); });
      att.view.group.position.copy(a);
      return;
    }
    const proj = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), new THREE.MeshBasicMaterial({ color: att.def.color }));
    game.view.battleRoot.add(proj);
    const dist = a.distanceTo(b);
    await tween(Math.min(0.5, 0.15 + dist / 120), k => {
      proj.position.lerpVectors(a, b, k);
      proj.position.y += 2.5 + Math.sin(k * Math.PI) * dist * 0.15;
    });
    game.view.battleRoot.remove(proj);
  },
  removeUnit(u) {
    const g = u.view.group;
    u.view.label.visible = false;
    tween(0.4, k => { g.scale.setScalar(1 - k * 0.9); }).then(() => removeWithLabels(g));
  }
};

// Removes an object and makes sure CSS2D label elements inside it leave the DOM too.
function removeWithLabels(obj) {
  const labels = [];
  obj.traverse(o => { if (o.isCSS2DObject) labels.push(o); });
  for (const l of labels) { if (l.element.parentNode) l.element.parentNode.removeChild(l.element); }
  if (obj.parent) obj.parent.remove(obj);
}

// =============================================================================
// Stealth (PROMPT 9): facing, sight cones, hearing and smell.
// =============================================================================
const Stealth = {
  inCone(enemy, tq, tr) {
    const a = hexToWorld(enemy.q, enemy.r), b = hexToWorld(tq, tr);
    const dir = vectorToDirection(b.x - a.x, b.z - a.z);
    const diff = Math.min((dir - enemy.facing + 6) % 6, (enemy.facing - dir + 6) % 6);
    return diff <= 1;
  },
  sees(field, enemy, tq, tr) {
    const dist = hexDistance(enemy.q, enemy.r, tq, tr);
    if (dist > enemy.def.sight || dist === 0 || !this.inCone(enemy, tq, tr)) return false;
    return Combat.lineOfSight(field, field.get(enemy.q, enemy.r), field.get(tq, tr)).clear;
  },
  // Does `enemy` detect undead unit `u`? Returns the sense or null.
  detects(field, enemy, u) {
    const dist = hexDistance(enemy.q, enemy.r, u.q, u.r);
    if (this.sees(field, enemy, u.q, u.r)) return 'Sicht';
    if (dist <= enemy.def.hear && u.def.size >= 2 && u.movedThisTurn) return 'Gehör';
    if (dist <= enemy.def.smell && !u.def.spectral) return 'Geruch';
    return null;
  },
  check(battle, units) {
    for (const e of battle.units) {
      if (e.side !== 'enemy' || !e.alive) continue;
      for (const u of units) {
        if (!u.alive) continue;
        const sense = this.detects(battle.field, e, u);
        if (sense) return { enemy: e, unit: u, sense };
      }
    }
    return null;
  },
  coneTiles(battle) {
    const set = new Map();
    for (const e of battle.units) {
      if (e.side !== 'enemy' || !e.alive) continue;
      for (const t of battle.field.tilesWithin(e.q, e.r, e.def.sight)) {
        if (this.sees(battle.field, e, t.q, t.r)) set.set(battle.field.index(t), t);
      }
    }
    return [...set.values()];
  }
};

// =============================================================================
// Battle
// Initiative, turns, movement, attacks, round effects, victory and defeat.
// Rules work on plain data objects; BattleView only mirrors them.
// =============================================================================
let unitIdCounter = 1;
const Battle = {
  async start(node) {
    const c = game.campaign;
    if (this.starting) return;
    // Load the figures of everyone taking part first (scripts, on demand).
    this.starting = true;
    UI.toast('Die Toten erheben sich …');
    await Figures.ensure([...c.army.map(a => a.type), ...Campaign.garrisonFor(node)]);
    this.starting = false;
    if (!node.encounter) Campaign.registerAttack(node);
    const field = new Battlefield(node);
    const origin = NODE_BY_ID[c.prevNodeId] && c.prevNodeId !== node.id ? NODE_BY_ID[c.prevNodeId] : PHYLACTERY;
    const cpos = hexToWorld(node.q, node.r), opos = hexToWorld(origin.q, origin.r);
    let dx = opos.x - cpos.x, dz = opos.z - cpos.z;
    if (Math.hypot(dx, dz) < 1e-3) { dx = 0; dz = 1; }
    const len = Math.hypot(dx, dz), dir = { x: dx / len, z: dz / len };
    const b = game.battle = {
      node, field, dir, units: [], log: [], round: 1, lastTick: null, current: null,
      state: 'fight', busy: false, retreatPending: false, kills: [], reach: null, targets: [],
      selected: null, hover: null, over: false
    };
    // Player army.
    for (const g of groupByType(c.army)) b.units.push(this.makeStack(g.type, 'player', 'UNDEAD', g.hps));
    this.applyArmyEffects(b);
    this.applyLichBonus(b);
    const garrison = Campaign.garrisonFor(node).map(type => ({ type, hp: DATA.units[type].hp }));
    for (const g of splitStacks(groupByType(garrison))) b.units.push(this.makeStack(g.type, 'enemy', node.faction, g.hps));
    this.deploy(b);

    // View: lock the tile window on the node, dim everything outside the field.
    const tr = game.view.tiles;
    tr.floorOverride = (q, r) => { const t = field.get(q, r); return t ? FLOOR_INDEX[t.floor] : -1; };
    tr.dimOutside = (q, r) => !field.contains(q, r);
    tr.locked = true;
    tr.center = [node.q, node.r];
    tr.rebuild();
    WorldView.setVisible(false);
    BattleView.init(field);
    b.units.forEach(u => BattleView.createUnit(u));
    const cam = game.view.cam;
    cam.setFieldBounds(field.q0, field.r0, field.size);
    const pl = b.units.filter(u => u.side === 'player');
    const mq = Math.round((node.q + pl.reduce((s, u) => s + u.q, 0) / pl.length) / 2);
    const mr = Math.round((node.r + pl.reduce((s, u) => s + u.r, 0) / pl.length) / 2);
    cam.lookAtTile(mq, mr);
    cam.yaw = Math.atan2(dir.x, dir.z);
    cam.distance = Math.min(CAM.maxZoom, 25 + node.size * 1.4);
    game.mode = 'battle';
    UI.enterBattle();
    this.log(`${node.encounter ? node.name + '!' : 'Angriff auf ' + node.name + '!'} (${b.units.filter(u => u.side === 'enemy').reduce((n, u) => n + stackCount(u), 0)} Verteidiger in ${b.units.filter(u => u.side === 'enemy').length} Gruppen)`, 'hit');

    // Stealth phase (PROMPT 9).
    const base = vectorToDirection(dir.x, dir.z), rng = makeRng(field.seed + 17);
    for (const u of b.units) if (u.side === 'enemy') u.facing = (base + Math.floor(rng() * 3) - 1 + 6) % 6;
    const found = Stealth.check(b, b.units.filter(u => u.side === 'player'));
    if (found) {
      b.state = 'fight';
      for (const u of b.units) if (u.side === 'enemy') u.nextTick -= roundFrac(3);
      UI.toast(`Entdeckt! ${found.enemy.def.name} bemerkt ${found.unit.def.name} (${found.sense}).`);
      this.log(`Entdeckt durch ${found.sense}: Die Verteidiger handeln zuerst.`, 'hit');
    } else {
      b.state = 'stealth';
      UI.toast('Der Wind steht günstig. Die Wachen haben euch nicht bemerkt.');
      this.log('Schleich-Modus: Die Gegner haben euch nicht bemerkt. Ein Angriff aus dem Verborgenen ist ein Überraschungsangriff.', 'good');
    }
    this.refreshCones();
    SaveGame.save();
    this.nextTurn();
  },
  // A stack of `hps.length` creatures. Wounds are pooled so only the top creature is wounded
  // (never fewer creatures than came in).
  makeStack(type, side, faction, hps) {
    const def = DATA.units[type], n = hps.length;
    const total = Math.max((n - 1) * def.hp + 1, hps.reduce((a, h) => a + h, 0));
    const u = this.makeUnit(type, side, faction, total);
    u.maxHp = n * def.hp; u.startCount = n; u.shield = (def.soulShield || 0) * n;
    return u;
  },
  // The Lich grows with his army (economy.lichArmyBonus per command point in use). His def is
  // copied so the bonus stays in this battle; wounds keep their share of the boosted HP.
  applyLichBonus(b) {
    const lich = b.units.find(u => u.type === 'lich'), B = ECON.lichArmyBonus;
    if (!lich || !B) return;
    const cp = Campaign.commandUsed(), base = lich.def;
    const fx = Campaign.effects();
    const add = { hp: Math.round(cp * B.hpPerCommand) + (fx.lichHp || 0), damage: Math.round(cp * B.damagePerCommand) + (fx.lichDamage || 0),
      soulShield: Math.round(cp * B.shieldPerCommand) + (fx.lichShield || 0) };
    lich.def = { ...base, hp: base.hp + add.hp, damage: base.damage + add.damage, soulShield: base.soulShield + add.soulShield };
    lich.hp = Math.max(1, Math.round(lich.hp / base.hp * lich.def.hp));
    lich.maxHp = lich.def.hp; lich.shield = lich.def.soulShield;
    if (cp > 0 || add.hp) this.log(`Der Lich zieht Kraft aus Armee (${cp} Kommando) und Artefakten: +${add.hp} LP, +${add.damage} Schaden, +${add.soulShield} Seelenschild.`, 'good');
  },
  // Artifacts and owned special places strengthen every undead stack (copied defs, battle only).
  applyArmyEffects(b) {
    const fx = Campaign.effects();
    if (!fx.undeadHpPct && !fx.undeadDamagePct && !fx.undeadMr && !fx.undeadIni) return;
    for (const u of b.units) {
      if (u.side !== 'player' || u.type === 'lich') continue;
      const base = u.def, n = stackCount(u);
      u.def = { ...base, hp: Math.round(base.hp * (1 + (fx.undeadHpPct || 0))), damage: Math.round(base.damage * (1 + (fx.undeadDamagePct || 0))),
        magicResist: base.magicResist + (fx.undeadMr || 0), initiative: base.initiative + (fx.undeadIni || 0) };
      u.hp = Math.round(u.hp / base.hp * u.def.hp); u.maxHp = n * u.def.hp;
      u.nextTick = turnTicks(u.def);
    }
  },
  // Battle HP of the Lich back to his campaign HP (without the army bonus).
  lichCampaignHp(u) { return Math.max(1, Math.round(u.hp / u.def.hp * DATA.units.lich.hp)); },
  makeUnit(type, side, faction, hp) {
    const def = DATA.units[type];
    return { id: unitIdCounter++, type, def, side, faction, hp: hp ?? def.hp, maxHp: def.hp, startCount: 1, q: 0, r: 0,
      shield: def.soulShield || 0, nextTick: turnTicks(def), alive: true, facing: 0, movedThisTurn: false, idleTurns: 0, view: null };
  },
  // Deployment: player at the side facing the origin, enemies around the center.
  deploy(b) {
    const f = b.field, size = f.size, cpos = hexToWorld(f.cq, f.cr);
    // Nobody starts in the water except flyers (a ballista in a pond helps no one).
    const canStand = (u, t) => t && !t.unit && (u.def.flying || (f.walkable(t) && !f.isWater(t)));
    const players = b.units.filter(u => u.side === 'player');
    const D = Math.min(size / 2 - 2, 12);
    const free = f.tiles.filter(t => t && t.building === null && f.walkable(t) && !f.isWater(t));
    const scored = free.map(t => {
      const p = hexToWorld(t.q, t.r), vx = p.x - cpos.x, vz = p.z - cpos.z;
      return { t, proj: (vx * b.dir.x + vz * b.dir.z) / ROW_SPACING, perp: Math.abs(vx * b.dir.z - vz * b.dir.x) / ROW_SPACING,
        dist: hexDistance(t.q, t.r, f.cq, f.cr) };
    });
    let slack = 0, cands = [];
    while (cands.length < players.length && slack < size) {
      cands = scored.filter(s => s.dist <= D + slack && s.proj >= D - 2 - slack).sort((a, c) => a.perp - c.perp || c.proj - a.proj);
      slack++;
    }
    for (const u of players) {
      const s = cands.find(s => canStand(u, s.t));
      const t = s ? s.t : free.find(t => canStand(u, t));
      this.putUnit(u, t);
    }
    // Enemies within min(size/4, 8) of the center, preferably in buildings (max 2 per building).
    const Re = Math.min(size / 4, 8);
    const area = f.tilesWithin(f.cq, f.cr, Re).sort((a, c) => hash2(a.q, a.r, f.seed) - hash2(c.q, c.r, f.seed));
    const ordered = [...area.filter(t => t.building !== null), ...area.filter(t => t.building === null)];
    const perBuilding = {};
    const enemies = b.units.filter(u => u.side === 'enemy').sort((a, c) => (c.def.rank === 'UNIQUE') - (a.def.rank === 'UNIQUE'));
    for (const u of enemies) {
      let t = null;
      if (u.def.rank === 'UNIQUE') t = area.filter(x => canStand(u, x)).sort((a, c) => hexDistance(a.q, a.r, f.cq, f.cr) - hexDistance(c.q, c.r, f.cq, f.cr))[0];
      // Machines: on a watch tower if there is one, otherwise in the open (never inside houses).
      if (!t && u.def.rank === 'MACHINE') t = ordered.find(x => canStand(u, x) && x.building !== null && f.buildings[x.building].key === 'tower' && !perBuilding[x.building]);
      if (!t) t = ordered.find(x => canStand(u, x) && (x.building === null || (u.def.rank !== 'MACHINE' && (perBuilding[x.building] || 0) < 2)));
      if (!t) t = f.tiles.filter(x => canStand(u, x)).sort((a, c) => hexDistance(a.q, a.r, f.cq, f.cr) - hexDistance(c.q, c.r, f.cq, f.cr))[0];
      if (t && t.building !== null) perBuilding[t.building] = (perBuilding[t.building] || 0) + 1;
      this.putUnit(u, t);
    }
  },
  putUnit(u, t) { u.q = t.q; u.r = t.r; t.unit = u; },
  alive(side) { return game.battle.units.filter(u => u.alive && (!side || u.side === side)); },
  log(text, cls) {
    const b = game.battle;
    b.log.push({ text, cls });
    UI.appendLog(text, cls);
  },
  // Orders units by (nextTick, higher initiative, player first, id).
  order(a, c) {
    return a.nextTick - c.nextTick || c.def.initiative - a.def.initiative || (a.side === 'player' ? -1 : 1) - (c.side === 'player' ? -1 : 1) || a.id - c.id;
  },
  candidates() {
    const b = game.battle;
    return this.alive(b.state === 'stealth' ? 'player' : null);
  },
  // Predicts the next n turns for the initiative bar.
  forecast(n) {
    const sim = this.candidates().map(u => ({ u, nextTick: u.nextTick, def: u.def, side: u.side, id: u.id }));
    const out = [];
    for (let i = 0; i < n && sim.length; i++) {
      sim.sort((a, c) => this.order(a, c));
      out.push(sim[0].u);
      sim[0].nextTick += turnTicks(sim[0].def);
    }
    return out;
  },
  async nextTurn() {
    const b = game.battle;
    if (!b || b.over) return;
    const list = this.candidates().sort((a, c) => this.order(a, c));
    if (!list.length) return;
    const u = list[0];
    // Round boundaries: each time the tick passes a multiple of roundTicks.
    if (b.lastTick !== null) {
      const rounds = Math.floor(u.nextTick / RULES.roundTicks) - Math.floor(b.lastTick / RULES.roundTicks);
      for (let i = 0; i < rounds && !b.over; i++) this.endRound();
      if (b.over) return;
    }
    b.lastTick = u.nextTick;
    b.current = u;
    b.selected = u;
    u.hasMoved = false; u.hasAttacked = false; u.movedThisTurn = false;
    if (u.side === 'player' && u.type === 'lich' && b.retreatPending) { this.finish('retreat'); return; }
    UI.updateBattle();
    if (u.side === 'player') {
      this.computeOptions();
    } else {
      b.busy = true;
      this.clearOptions();
      await EnemyAI.takeTurn(u);
      if (game.battle !== b) return;
      b.busy = false;
      if (!b.over) this.endTurn();
    }
  },
  endRound() {
    const b = game.battle;
    b.round++;
    this.log(`— Runde ${b.round} —`);
    for (const u of this.alive('player')) {
      const t = b.field.get(u.q, u.r), eff = DATA.floorTypes[t.floor].effect;
      if (!eff) continue;
      if (eff.damageUndeadPerRound) {
        this.applyDamage(u, eff.damageUndeadPerRound, null, null);
        this.log(`${u.def.name} brennt auf geweihtem Boden (−${eff.damageUndeadPerRound}).`, 'hit');
      }
      if (eff.healUndeadPerRound && topHp(u) < u.def.hp) {
        const h = Math.min(eff.healUndeadPerRound, u.def.hp - topHp(u));
        u.hp += h; BattleView.updateHp(u); BattleView.floatText(u, '+' + h, true);
        this.log(`${u.def.name} zieht Kraft aus der Friedhofserde (+${h}).`, 'good');
      }
    }
  },
  endTurn() {
    const b = game.battle;
    if (!b || b.over || b.busy) return;
    const u = b.current;
    u.nextTick += turnTicks(u.def);
    this.clearOptions();
    setTimeout(() => this.nextTurn(), 30);
  },
  // Reach and attack targets for the active player unit.
  computeOptions() {
    const b = game.battle, u = b.current;
    const from = b.field.get(u.q, u.r);
    // After an attack only MOVE_AFTER_ATTACK of the movement is left (at least 1).
    b.reach = u.hasMoved ? null : Pathfinding.reachable(b.field, u, u.hasAttacked ? Math.max(1, Math.floor(u.def.move * MOVE_AFTER_ATTACK)) : u.def.move);
    b.targets = u.hasAttacked ? [] : b.units.filter(t => Combat.canAttack(b.field, u, from, t).ok);
    this.drawOptions();
    UI.updateBattle();
  },
  clearOptions() {
    const b = game.battle;
    b.reach = null; b.targets = [];
    BattleView.setOverlay(BattleView.overlay, []);
    BattleView.setOverlay(BattleView.pathOverlay, []);
  },
  drawOptions() {
    const b = game.battle, list = [];
    if (b.reach) for (const t of b.reach.tiles) if (t.unit !== b.current) list.push({ t, color: '#3b6fd8' });
    for (const u of b.targets) list.push({ t: b.field.get(u.q, u.r), color: u.side === b.current.side ? '#3fae4a' : '#d03030', lift: 0.02 });
    BattleView.setOverlay(BattleView.overlay, list);
  },
  refreshCones() {
    const b = game.battle;
    BattleView.setOverlay(BattleView.coneOverlay, b.state === 'stealth' ? Stealth.coneTiles(b).map(t => ({ t, color: '#ff8a2a' })) : []);
  },
  // Animated movement along a path of tiles.
  async moveAlong(u, path) {
    const b = game.battle;
    if (!path || path.length < 2) return;
    b.field.get(u.q, u.r).unit = null;
    const dest = path[path.length - 1];
    dest.unit = u;
    for (let i = 1; i < path.length; i++) {
      const a = path[i - 1], c = path[i], pa = hexToWorld(a.q, a.r), pc = hexToWorld(c.q, c.r);
      BattleView.face(u, pc.x, pc.z);
      await tween(STEP_SECONDS, k => {
        const ya = surfaceY(a), yc = surfaceY(c);
        u.view.group.position.set(pa.x + (pc.x - pa.x) * k, ya + (yc - ya) * k + Math.sin(k * Math.PI) * 0.4, pa.z + (pc.z - pa.z) * k);
      });
      if (game.battle !== b) return;            // battle was closed meanwhile
    }
    u.q = dest.q; u.r = dest.r;
    u.movedThisTurn = true;
    BattleView.placeUnit(u);
  },
  // Player clicks a reachable tile.
  async playerMove(t) {
    const b = game.battle, u = b.current;
    const path = Pathfinding.path(b.field, b.reach, t);
    b.busy = true;
    this.clearOptions();
    await this.moveAlong(u, path);
    u.hasMoved = true;
    b.busy = false;
    if (b.state === 'stealth') {
      const found = Stealth.check(b, [u]);
      if (found) this.revealed(`${found.enemy.def.name} bemerkt ${u.def.name} (${found.sense})!`, -3, 'enemy');
      this.refreshCones();
    }
    this.computeOptions();
    if (!b.targets.length) { await wait(0.25); this.endTurn(); }
  },
  // Stealth ends: enemies get a fresh initiative start relative to now, then the bonus.
  revealed(msg, bonus, who) {
    const b = game.battle;
    b.state = 'fight';
    for (const u of this.alive('enemy')) u.nextTick = b.lastTick + turnTicks(u.def);
    for (const u of this.alive(who === 'enemy' ? 'enemy' : 'player')) u.nextTick += roundFrac(bonus);
    UI.toast(msg);
    this.log(msg, who === 'enemy' ? 'hit' : 'good');
    this.refreshCones();
    UI.updateBattle();
  },
  async playerAttack(target) {
    const b = game.battle, u = b.current;
    b.busy = true;
    this.clearOptions();
    const surprise = b.state === 'stealth' && target.side !== u.side;
    await this.performAttack(u, target, surprise);
    u.hasAttacked = true;
    b.busy = false;
    if (b.over) return;
    if (surprise) this.revealed('Überraschungsangriff! Die Untoten sind im Vorteil.', -5, 'player');
    // Attack first, move afterwards: the unit keeps its turn while it still has its move.
    if (u.alive && !u.hasMoved && b.current === u) {
      this.computeOptions();
      if (b.reach && b.reach.tiles.some(t => !t.unit)) return;
    }
    this.endTurn();
  },
  applyDamage(target, dmg, killer, power) {
    // Soul shield pool absorbs any damage first and does not regenerate during the battle.
    const absorbed = Math.min(target.shield || 0, dmg);
    target.shield = (target.shield || 0) - absorbed;
    const before = stackCount(target);
    target.hp -= dmg - absorbed;
    const deaths = before - stackCount(target);
    BattleView.updateHp(target);
    BattleView.floatText(target, dmg === 0 ? 'immun' : (absorbed ? `−${dmg - absorbed} (Schild ${absorbed})` : '−' + dmg) + (deaths && target.hp > 0 ? ` · ${deaths} †` : ''));
    // Every fallen creature leaves loot (corpse quality depends on the killing blow).
    if (target.side === 'enemy' && killer && killer.side === 'player')
      for (let i = 0; i < deaths; i++) game.battle.kills.push({ quality: DATA.corpseQuality[power] ?? 0, soul: power === 'SOUL' });
    if (deaths && target.hp > 0) this.log(`${deaths}× ${target.def.name} ${deaths > 1 ? 'fallen' : 'fällt'}, ${stackCount(target)} übrig.`, target.side === 'player' ? 'hit' : 'good');
    if (target.hp <= 0) this.kill(target, killer, power);
  },
  async performAttack(att, target, surprise = false) {
    const b = game.battle, f = b.field;
    const from = f.get(att.q, att.r), tt = f.get(target.q, target.r);
    const chk = Combat.canAttack(f, att, from, target);
    if (!chk.ok) return;
    const prof = Combat.profile(att, target);
    await BattleView.attackAnim(att, target, chk.dist > 1);
    if (game.battle !== b || b.over) return;
    if (prof.power === 'HEAL') {
      const h = Math.min(prof.damage, target.def.hp - topHp(target));
      target.hp += h; BattleView.updateHp(target); BattleView.floatText(target, '+' + h, true);
      this.log(`${att.def.name} heilt ${target.def.name} (+${h}).`);
      return;
    }
    const dmg = Combat.damage(prof, target.def, from.level, tt.level, chk.cover);
    if (dmg === 0) this.log(`${target.def.name} ist immun gegen ${POWER_NAMES[prof.power]}-Schaden.`, 'hit');
    else this.log(`${att.def.name} trifft ${target.def.name}: ${dmg} Schaden${chk.cover ? ' (Deckung)' : ''}${surprise ? ' – Überraschung!' : ''}.`, att.side === 'player' ? 'good' : 'hit');
    this.applyDamage(target, dmg, att, prof.power);
    if (b.over) return;
    // Counter: surviving melee targets with counter strike back once at 50 %.
    if (target.alive && chk.dist === 1 && target.def.counter) {
      const back = Combat.canAttack(f, target, tt, att);
      if (back.ok) {
        await wait(0.15);
        const cprof = Combat.profile(target, att);
        const full = Combat.damage(cprof, att.def, tt.level, from.level, back.cover);
        const cd = full === 0 ? 0 : Math.max(1, Math.round(full * 0.5));
        await BattleView.attackAnim(target, att, false);
        this.log(`${target.def.name} kontert: ${cd} Schaden.`, target.side === 'player' ? 'good' : 'hit');
        this.applyDamage(att, cd, target, cprof.power);
      }
    }
  },
  kill(u, killer, power) {
    const b = game.battle;
    if (!u.alive) return;
    u.alive = false;
    b.field.get(u.q, u.r).unit = null;
    BattleView.removeUnit(u);
    this.log(u.startCount > 1 ? `Die letzten ${u.def.name} fallen.` : `${u.def.name} fällt.`, u.side === 'player' ? 'hit' : 'good');
    if (u.side === 'player' && u.type === 'lich') { this.finish('defeat'); return; }
    if (!this.alive('enemy').length) this.finish('victory');
  },
  retreat() {
    const b = game.battle;
    if (!b || b.over || b.retreatPending) return;
    b.retreatPending = true;
    this.log('Rückzug befohlen. Er gelingt zu Beginn des nächsten Zugs des Lichs.', 'hit');
    UI.toast('Rückzug befohlen – zu Beginn des nächsten Lich-Zugs.');
  },
  // Battle ends: victory, defeat or retreat. Updates the campaign and shows a summary.
  finish(result) {
    const b = game.battle, c = game.campaign, node = b.node;
    if (b.over) return;
    b.over = true;
    c.battles++;
    let html = '';
    if (result === 'victory') {
      const fx = Campaign.effects();
      const corpses = Math.floor(b.kills.reduce((s, k) => s + ECON.corpsesPerKill * k.quality, 0) * (1 + (fx.lootCorpsesPct || 0)));
      const bones = Math.floor(b.kills.length * ECON.bonesPerKill * (1 + (fx.lootBonesPct || 0)));
      const souls = b.kills.filter(k => k.soul).length * ECON.soulsPerSoulKill + (fx.soulsPerVictory || 0);
      const knowledgeBonus = fx.knowledgePerVictory || 0;
      const reward = (ECON.nodeRewards[node.type] || {})[node.size] || {};
      const loot = { corpses, bones, souls };
      if (knowledgeBonus) loot.knowledge = knowledgeBonus;
      for (const [k, v] of Object.entries(reward)) loot[k] = (loot[k] || 0) + v;
      Campaign.addResources(loot);
      if (!node.encounter) c.owners[node.id] = 'UNDEAD';
      // Special place: artifact into the inventory (auto-equipped while a slot is free).
      const sp = node.special && DATA.specials[node.special];
      let found = '';
      if (sp && sp.artifact && !c.inventory.includes(sp.artifact)) {
        c.inventory.push(sp.artifact);
        if (c.equipped.length < DATA.artifactSlots) c.equipped.push(sp.artifact);
        const a = DATA.artifacts[sp.artifact];
        found = `<h3>Artefakt gefunden</h3><p><b>${a.name}</b> – ${a.text}${c.equipped.includes(sp.artifact) ? ' <span class="small">(angelegt)</span>' : ' <span class="small">(im Inventar)</span>'}</p>`;
      } else if (sp) found = `<h3>${sp.name}</h3><p>${sp.text}</p>`;
      // Survivors recover part of their strength after a won battle.
      let healed = 0;
      const healShare = ECON.postBattleHealShare + (fx.healPct || 0);
      c.army = this.alive('player').flatMap(u => {
        if (u.type === 'lich') {
          const hp = Math.min(DATA.units.lich.hp, this.lichCampaignHp(u) + Math.ceil(DATA.units.lich.hp * healShare));
          healed += hp - this.lichCampaignHp(u);
          return [{ type: 'lich', hp }];
        }
        const n = stackCount(u), cap = n * u.def.hp;
        const total = Math.min(cap, u.hp + n * Math.ceil(u.def.hp * healShare));
        healed += total - u.hp;
        // Back to individual creatures: all full except the top one.
        // Back in campaign units: artifact HP bonuses only exist in battle.
        const baseHp = DATA.units[u.type].hp, back = x => Math.max(1, Math.round(x / u.def.hp * baseHp));
        return Array.from({ length: n }, (_, i) => ({ type: u.type, hp: back(i < n - 1 ? u.def.hp : total - (n - 1) * u.def.hp) }));
      });
      const lines = Object.entries(loot).filter(([, v]) => v > 0).map(([k, v]) => `<li>${v} ${RESOURCE_NAMES[k]}</li>`).join('');
      html = node.encounter
        ? `<h2>${node.name} abgewehrt</h2><p>${b.kills.length} Feinde gefallen. Der Weg ist frei, die Reise geht weiter.</p>`
        : `<h2>Sieg bei ${node.name}</h2><p>${node.name} gehört nun den Untoten. ${b.kills.length} Feinde gefallen.</p>`;
      html += `
<h3>Beute</h3><ul>${lines || '<li>nichts</li>'}</ul>
        <p class="small">Die Überlebenden sammeln neue Kraft: +${Math.round(healShare * 100)} % ihrer Lebenspunkte (${healed} LP insgesamt).</p>${found}`;
      if (node.finale) c.won = true;
    } else if (result === 'defeat') {
      c.travel = null;
      c.army = [{ type: 'lich', hp: DATA.units.lich.hp }];
      c.nodeId = PHYLACTERY.id; c.prevNodeId = null;
      Campaign.advanceDays(ECON.lichDeathDays);
      html = `<h2>Der Lich fällt</h2><p>Die Armee zerfällt zu Staub. ${ECON.lichDeathDays} Tage später erwacht der Lich erneut im Hügelgrab am Wilseder Berg.</p>`;
    } else {
      c.travel = null;
      const lich = this.alive('player').find(u => u.type === 'lich');
      c.army = [{ type: 'lich', hp: lich ? this.lichCampaignHp(lich) : DATA.units.lich.hp }];
      c.nodeId = PHYLACTERY.id; c.prevNodeId = null;
      Campaign.advanceDays(1);
      html = `<h2>Rückzug</h2><p>Der Lich entweicht in die Nacht und kehrt nach einem Tag ins Hügelgrab zurück. Seine Diener bleiben zurück. Keine Beute.</p>`;
    }
    Campaign.healAtPhylactery();
    SaveGame.save();
    setTimeout(() => {
      UI.modal(html, [{ label: 'Weiter', primary: true, action: () => { this.exit(); if (c.won) UI.showEnd(); else if (c.travel) resumeTravel(); } }]);
    }, 700);
  },
  // Back to the world map.
  exit() {
    const tr = game.view.tiles;
    const root = game.view.battleRoot;
    while (root.children.length) removeWithLabels(root.children[0]);
    game.battle = null;
    tr.floorOverride = null; tr.dimOutside = null; tr.locked = false;
    game.view.cam.setMapBounds();
    const n = Campaign.armyNode();
    game.view.cam.lookAtTile(n.q, n.r);
    game.view.cam.distance = CAM.startZoom;
    tr.update(n.q, n.r, true);
    WorldView.setVisible(true);
    WorldView.placeArmy();
    WorldView.refresh();
    game.mode = 'world';
    UI.enterWorld();
    UI.selectNode(n.id);
  }
};

// =============================================================================
// EnemyAI (PROMPT 8.5)
// =============================================================================
const EnemyAI = {
  async takeTurn(u) {
    const b = game.battle, f = b.field;
    const here = f.get(u.q, u.r);
    const isBallista = u.type === 'balliste';
    const canMove = !isBallista || u.idleTurns >= 2;
    const reach = Pathfinding.reachable(f, u);
    const spots = canMove ? reach.tiles : [here];
    await wait(0.2);
    if (game.battle !== b) return;

    // 1. Priests heal the wounded ally with the largest deficit.
    if (u.def.power === 'HEAL') {
      let best = null;
      for (const t of spots) for (const a of this.allies(u)) {
        if (a === u || topHp(a) >= a.def.hp) continue;
        if (!Combat.canAttack(f, u, t, a).ok) continue;
        const score = (a.def.hp - topHp(a)) * 10 - hexDistance(t.q, t.r, here.q, here.r) * 0.5;
        if (!best || score > best.score) best = { t, a, score };
      }
      if (best) { await this.execute(u, reach, best.t, best.a); return; }
    }
    // 2. Score every reachable tile by its best attack.
    let best = null;
    for (const t of spots) {
      for (const p of Battle.alive('player')) {
        const chk = Combat.canAttack(f, u, t, p);
        if (!chk.ok) continue;
        const dmg = Combat.expected(f, u, t, p, chk.cover);
        let score = dmg + (dmg >= p.hp ? 30 : 0) + (p.type === 'lich' ? 15 : 0) - 0.5 * hexDistance(t.q, t.r, here.q, here.r);
        if (u.def.range > 1) {
          if (chk.dist >= chk.range) score += 3;                       // stay at maximum range
          if (Combat.lineOfSight(f, f.get(p.q, p.r), t).cover) score += 3;  // in cover against the target
          if (chk.dist === 1) score -= 4;
        }
        if (!best || score > best.score) best = { t, p, score };
      }
    }
    if (best) { u.idleTurns = 0; await this.execute(u, reach, best.t, best.p); return; }
    // 3. No attack: walk toward the nearest undead unit.
    u.idleTurns++;
    if (!canMove && !(isBallista && u.idleTurns >= 2)) return;
    const dest = this.approach(u, reach);
    if (dest && dest !== here) await Battle.moveAlong(u, Pathfinding.path(f, reach, dest));
  },
  allies(u) { return Battle.alive(u.side); },
  async execute(u, reach, tile, target) {
    const b = game.battle, f = b.field;
    if (tile !== f.get(u.q, u.r)) {
      await Battle.moveAlong(u, Pathfinding.path(f, reach, tile));
      await wait(AI_PAUSE);
    }
    if (game.battle === b && !b.over) await Battle.performAttack(u, target);
  },
  // Furthest tile along the shortest path to the nearest undead that the unit can reach this turn.
  approach(u, reach) {
    const f = game.battle.field;
    const targets = Battle.alive('player');
    // Goals: free tiles from which an attack is actually possible (not merely adjacent,
    // which would include tiles behind a wall, e.g. inside a house next to the target).
    const goalsOf = search => {
      let best = null, bestCost = Infinity;
      for (const [i, c] of search.cost) {
        const t = f.tiles[i];
        if ((t.unit && t.unit !== u) || c >= bestCost) continue;
        if (targets.some(p => Combat.canAttack(f, u, t, p).ok)) { best = t; bestCost = c; }
      }
      return best;
    };
    // First try with units blocking; if allies block the only way out (a door), plan through
    // them and walk up to the first occupied tile, so the unit queues behind its ally.
    for (const ignoreUnits of [false, true]) {
      const full = Pathfinding.search(f, u, 9999, ignoreUnits);
      const goal = goalsOf(full);
      if (!goal) continue;
      const path = Pathfinding.path(f, full, goal);
      let dest = null, cost = 0;
      for (let i = 0; i < path.length; i++) {
        const t = path[i];
        if (i > 0) {
          const d = directionTo(path[i - 1].q, path[i - 1].r, t.q, t.r);
          cost += Pathfinding.stepCost(f, u, path[i - 1], d, t, true);
        }
        if (cost > u.def.move) break;
        if (t.unit && t.unit !== u) { if (u.def.flying) continue; break; }
        dest = t;
      }
      if (dest && dest !== f.get(u.q, u.r)) return dest;
    }
    // Fallback: the reachable tile closest to any undead.
    let best = null, bd = Infinity;
    for (const t of reach.tiles) for (const p of Battle.alive('player')) {
      const d = hexDistance(t.q, t.r, p.q, p.r);
      if (d < bd) { bd = d; best = t; }
    }
    return best;
  }
};

// =============================================================================
// UI (DOM panels; reads game state, sends player intents to Campaign/Battle)
// =============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const UI = {
  selectedNode: null,
  toastTimer: null,
  show(id, on) { $(id).classList.toggle('hidden', !on); },
  toast(text, seconds = 3.5) {
    const t = $('toast');
    t.textContent = text; t.classList.remove('hidden'); t.style.opacity = '1';
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.classList.add('hidden'), 400); }, seconds * 1000);
  },
  modal(html, buttons) {
    $('modalBody').innerHTML = html + '<div class="buttons"></div>';
    const box = $('modalBody').querySelector('.buttons');
    for (const b of buttons) {
      const el = document.createElement('button');
      el.textContent = b.label; if (b.primary) el.className = 'primary';
      el.onclick = () => { if (!b.keepOpen) this.closeModal(); b.action && b.action(); };
      box.appendChild(el);
    }
    this.show('modal', true);
  },
  closeModal() { this.show('modal', false); },

  // ---- World map ----------------------------------------------------------
  enterWorld() {
    ['header', 'info', 'minimap', 'hint', 'worldButtons'].forEach(id => this.show(id, true));
    ['initBar', 'roundInfo', 'unitCard', 'battleLog', 'battleButtons', 'edgeTip'].forEach(id => this.show(id, false));
    $('hint').textContent = 'W/A/S/D: bewegen · Q/E oder rechte Maustaste: drehen und neigen · Mausrad: Zoom · Linksklick: auswählen · R: Rekrutierung finden · H: Hügelgrab · I: Inventar · F3: Debug';
    this.updateHeader();
    this.renderInfo();
  },
  updateHeader() {
    const c = game.campaign;
    $('date').textContent = Campaign.dateString(c.dayCount);
    const r = c.resources;
    const tip = k => esc(this.resourceTip(k)).replace(/\n/g, '&#10;');
    $('resources').innerHTML = `<span title="${tip('corpses')}">Leichen <b>${r.corpses}</b></span><span title="${tip('bones')}">Knochen <b>${r.bones}</b></span>
      <span title="${tip('souls')}">Seelen <b>${r.souls}</b></span><span title="${tip('knowledge')}">Wissen <b>${r.knowledge}</b></span>
      <span title="${tip('command')}">Kommando <b>${Campaign.commandUsed()} / ${Campaign.commandLimit()}</b></span>`;
    $('threats').innerHTML = ENEMY_FACTIONS.map(f => {
      const v = Math.round(c.threat[f]), living = Campaign.isLiving(f);
      return `<div class="threat ${living ? '' : 'dead'}" title="Bedrohung ${DATA.factions[f].name}: ${v} %">${DATA.factions[f].name} ${v} %
        <div class="bar"><div style="width:${v}%;background:${DATA.factions[f].color}"></div></div></div>`;
    }).join('');
  },
  selectNode(id) {
    this.selectedNode = id;
    this.selectedTile = null;
    WorldView.refresh();
    this.renderInfo();
  },
  // Fixed reward for conquering a place (kills add corpses, bones and souls on top).
  rewardText(node) {
    const r = (ECON.nodeRewards[node.type] || {})[node.size] || {};
    const parts = Object.entries(r).filter(([, v]) => v > 0).map(([k, v]) => `${v} ${RESOURCE_NAMES[k]}`);
    if (node.type === 'MYTHIC') parts.push(`+${ECON.commandLimitPerMythicNode} Kommando`);
    return (parts.join(', ') || '—') + '<br><span class="small">dazu Beute von gefallenen Gegnern</span>';
  },
  // Camera to a place and select it (its info box offers travelling there).
  focusNode(node) {
    if (game.mode !== 'world') return;
    game.view.cam.lookAtTile(node.q, node.r);
    this.selectNode(node.id);
  },
  // Recruiting sites sorted by travel time from the army; repeated clicks step through them.
  findRecruitSite() {
    const here = Campaign.armyNode();
    const sites = DATA.nodes.filter(n => Recruitment.canRecruitAt(n))
      .sort((a, b) => Campaign.travelDays(here, a) - Campaign.travelDays(here, b) || hexDistance(here.q, here.r, a.q, a.r) - hexDistance(here.q, here.r, b.q, b.r));
    if (!sites.length) return;
    const fresh = this.recruitCycleFrom !== here.id || performance.now() - (this.recruitCycleAt || 0) > 8000;
    this.recruitCycle = fresh ? 0 : (this.recruitCycle + 1) % sites.length;
    this.recruitCycleFrom = here.id; this.recruitCycleAt = performance.now();
    const n = sites[this.recruitCycle];
    this.focusNode(n);
    const d = Campaign.travelDays(here, n);
    this.toast(`${n.name}: ${n.id === here.id ? 'Armee steht hier' : d + (d === 1 ? ' Tag' : ' Tage') + ' entfernt'} (${this.recruitCycle + 1}/${sites.length})`);
  },
  // Mouse-over help for the resources in the header: how to get them and what they are for.
  resourceTip(k) {
    const income = {};
    for (const n of Campaign.ownedSpecials()) for (const [r, v] of Object.entries(DATA.specials[n.special].income || {})) income[r] = (income[r] || 0) + v;
    const sites = r => Object.entries(DATA.specials).filter(([, sp]) => sp.income && sp.income[r]).map(([id]) => DATA.nodes.find(n => n.special === id)).filter(Boolean).map(n => n.name).join(', ');
    const users = r => Object.values(DATA.units).filter(u => u.side === 'undead' && u.cost && u.cost[r]).map(u => u.name).join(', ');
    const q = DATA.corpseQuality, pct = v => Math.round(v * 100) + ' %';
    const daily = income[k] ? `\nZurzeit +${income[k]} pro Tag aus eroberten Orten.` : '';
    if (k === 'corpses') return `Leichen\n• Jeder gefallene Gegner gibt ${ECON.corpsesPerKill} Leiche × Qualität der Todesart: Stich ${pct(q.PIERCE)}, Seele ${pct(q.SOUL)}, Wucht ${pct(q.BLUNT)}, Arkan ${pct(q.ARCANE)}, Reißen ${pct(q.REND)}, Feuer ${pct(q.FIRE)}.\n• Eroberung aller Orte (Dörfer, Städte, Klöster, mythische Orte).\n• Täglich aus: ${sites('corpses')}.\nBraucht: ${users('corpses')}.${daily}`;
    if (k === 'bones') return `Knochen\n• ${ECON.bonesPerKill} Knochen je gefallenem Gegner, egal wie er starb.\n• Eroberung von Dörfern und Städten.\n• Täglich aus: ${sites('bones')}.\nBraucht: ${users('bones')}.${daily}`;
    if (k === 'souls') return `Seelen\n• ${ECON.soulsPerSoulKill} Seele je Gegner, der durch Seelenschaden stirbt (Lich, Geist).\n• Eroberung mythischer Orte.\n• Täglich aus: ${sites('souls')}.\n• Artefakt: Glocke von Rungholt (+2 pro Sieg).\nBraucht: ${users('souls')}.${daily}`;
    if (k === 'knowledge') {
      const locked = Object.values(DATA.units).filter(u => u.side === 'undead' && u.requiresKnowledge).map(u => `${u.name} (${u.requiresKnowledge})`).join(', ');
      return `Wissen\n• Eroberung von Klöstern (ihre Bücher) und mythischen Orten.\n• Artefakt: Lehniner Weissagung (+1 pro Sieg).\nSchaltet Einheiten frei: ${locked}. Wird nicht verbraucht.`;
    }
    return `Kommando\n• Der Lich führt ${ECON.commandLimitBase} Kommando-Punkte.\n• +${ECON.commandLimitPerMythicNode} je eroberter mythischer Ort.\n• Artefakt: Codex von Corvey (+8).\nJede Einheit belegt Punkte (Ghul 2, Skelett 1 …). Je mehr belegt, desto stärker der Lich im Kampf.`;
  },
  // What a special place offers (income / buff while owned, artifact on conquest).
  specialText(node) {
    const sp = DATA.specials[node.special];
    if (sp.artifact) {
      const a = DATA.artifacts[sp.artifact], have = game.campaign.inventory.includes(sp.artifact);
      return `★ <b>${a.name}</b>${have ? ' <span class="small">(im Inventar)</span>' : ''}<br><span class="small">${a.text}</span>`;
    }
    return `★ <b>${sp.name}</b><br><span class="small">${sp.text}</span>`;
  },
  // Inventory: artifacts (equip up to DATA.artifactSlots) and owned special places.
  openInventory() {
    const c = game.campaign, slots = DATA.artifactSlots;
    const row = id => {
      const a = DATA.artifacts[id], on = c.equipped.includes(id);
      const full = !on && c.equipped.length >= slots;
      return `<div class="recruitRow" style="grid-template-columns:1fr auto"><div><b>${a.name}</b>${on ? ' <span class="small">· angelegt</span>' : ''}<br><span class="small">${a.text}</span></div>
        <div><button data-art="${id}" ${full ? 'disabled title="Alle Plätze belegt"' : ''}>${on ? 'Ablegen' : 'Anlegen'}</button></div></div>`;
    };
    const arts = c.inventory.length ? c.inventory.map(row).join('')
      : '<p class="small">Noch keine Artefakte. Orte mit ★ auf der Karte bergen Artefakte, Einkommen oder dauerhafte Vorteile.</p>';
    const owned = Campaign.ownedSpecials();
    const sites = owned.length ? '<ul>' + owned.map(n => `<li><b>${esc(n.name)}</b>: ${DATA.specials[n.special].text || DATA.artifacts[DATA.specials[n.special].artifact].name + ' geborgen'}</li>`).join('') + '</ul>'
      : '<p class="small">Noch keine besonderen Orte erobert.</p>';

      undeadMr: 'Untote Magieresistenz', undeadIni: 'Untote Initiative', travelPct: 'Reisetempo', commandLimit: 'Kommando', healPct: 'Heilung nach Sieg',
      soulsPerVictory: 'Seelen pro Sieg', knowledgePerVictory: 'Wissen pro Sieg', lootBonesPct: 'Knochen aus Kämpfen', lootCorpsesPct: 'Leichen aus Kämpfen' };
    const fmt = (k, v) => k.endsWith('Pct') ? `+${Math.round(v * 100)} %` : `+${v}`;
    const total = Object.entries(fx).filter(([, v]) => v).map(([k, v]) => `${NAMES[k] || k} ${fmt(k, v)}`).join(' · ') || 'keine';
    const income = {};

      const id = b.dataset.art, i = c.equipped.indexOf(id);
      if (i >= 0) c.equipped.splice(i, 1); else if (c.equipped.length < slots) c.equipped.push(id);

  },
  armyHtml() {

  openRecruit() {

      <p class="small">Leichen ${r.corpses} · Knochen ${r.bones} · Seelen ${r.souls} · Wissen ${r.knowledge} · Kommando ${Campaign.commandUsed()} / ${Campaign.commandLimit()}</p>

  showEnd() {

      <p>Auf dem mächtigsten Ley-Knoten Norddeutschlands schweigt der Hexensabbat. Der Lich trinkt die Kraft der Walpurgisnacht, und über das Land legt sich ein langer Schatten.</p>
      <table><tr><td>Vergangene Tage</td><td>${c.dayCount}</td></tr><tr><td>Kämpfe</td><td>${c.battles}</td></tr>
      <tr><td>Eroberte Orte</td><td>${conquered} von ${DATA.nodes.length - 1}</td></tr><tr><td>Datum</td><td>${Campaign.dateString(c.dayCount)}</td></tr></table>`,
      [{ label: 'Neues Spiel', primary: true, action: () => newGame() }, { label: 'Weiter umherziehen', action: () => { game.mode = 'world'; } }]);
  },

  // ---- Battle -------------------------------------------------------------
  enterBattle() {

  updateBattle() {

  renderUnitCard(u) {

    const n = stackCount(u);

      <div class="hpbar ${u.side === 'player' ? 'player' : ''}"><div style="width:${100 * u.hp / u.maxHp}%"></div></div>
      <table><tr><td>Anzahl</td><td>${n} / ${u.startCount}</td><td>Initiative</td><td>${d.initiative}</td></tr>
      <tr><td>Lebenspunkte</td><td colspan="3">${n ? topHp(u) : 0} / ${d.hp} (vorderste) · ${Math.max(0, u.hp)} / ${u.maxHp} gesamt</td></tr>
      <tr><td>Bewegung</td><td>${d.move}</td><td>Reichweite</td><td>${d.range}</td></tr>
      <tr><td>Schaden</td><td colspan="3">${d.damage}${n > 1 ? ` × ${n} = ${d.damage * n}` : ''} ${POWER_NAMES[d.power]} (${d.power})</td></tr>
      <tr><td>Rüstung</td><td colspan="3">${DEFENSE_NAMES[d.defense]} (${d.defense})</td></tr>
      <tr><td>Magieres.</td><td>${d.magicResist}</td><td>Seelenschild</td><td>${u.shield ?? d.soulShield} / ${d.soulShield * u.startCount}</td></tr>
      <tr><td>Sinne</td><td colspan="3">Sicht ${d.sight} · Gehör ${d.hear} · Geruch ${d.smell}</td></tr>

      <tr><td>Feld</td><td colspan="3">${DATA.floorTypes[t.floor].name}, Stufe ${t.level}${t.building !== null ? ' · ' + b.field.buildings[t.building].name : ''}</td></tr></table>`;
